name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Ixotic27
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23f472b6&color_dots=%23161b22,%230e7490,%2306b6d4,%2322d3ee,%23a7f3d0

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
